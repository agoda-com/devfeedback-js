name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: setup
        uses: ./.actions/setup
        with:
          cache-key: ci-build
      - name: build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: setup
        uses: ./.actions/setup
        with:
          cache-key: ci-test
      - name: test
        run: pnpm test

  # The script-shell wrapper copies pnpm's SIGINT trap; catch pnpm changing it.
  pnpm-latest:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: setup
        uses: ./.actions/setup
        with:
          cache-key: ci-pnpm-latest
      - name: install the newest pnpm
        run: npm install --global --prefix "$RUNNER_TEMP/pnpm-latest" pnpm@latest
      - name: pnpm SIGINT trap
        run: pnpm --filter agoda-devfeedback-common exec vitest run src/lib/pnpm-sigint-trap.spec.ts
        env:
          PNPM_TRAP_CHECK_BIN: ${{ runner.temp }}/pnpm-latest/bin/pnpm

  types:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: setup
        uses: ./.actions/setup
        with:
          cache-key: ci-types
      - name: types
        run: pnpm check-types

  npm-publish-preflight:
    name: npm-publish-preflight
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify npm publish credentials
        env:
          NPM_TOKEN: ${{ secrets.npm_token }}
        run: node .github/scripts/npm-preflight.mjs
